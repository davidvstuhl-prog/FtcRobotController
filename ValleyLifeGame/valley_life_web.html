/* Layout: one 16:9 game canvas, letterboxed and centered on a deep night-valley ground. Single dark look on purpose. */
:root {
  --ground: #0d1220;
  --frame: #2b3554;
  --ink: #e9edf8;
  --muted: #8e9abd;
  --accent: #ffcd3c;
  --font-game: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-game);
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: hidden;
}
#wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#game {
  display: block;
  max-width: 100%;
  border-radius: 12px;
  box-shadow: 0 0 0 2px var(--frame), 0 18px 50px rgba(0, 0, 0, .5);
  touch-action: none;
  background: #000;
  outline: none;
}
#game:focus-visible { box-shadow: 0 0 0 2px var(--accent), 0 18px 50px rgba(0, 0, 0, .5); }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
</style>

function makeNoise(w, h, scale, seed) {
  const r = makeRng(seed * 7919 + 13);
  const gw = Math.floor(w/scale)+3, gh = Math.floor(h/scale)+3;
  const g = []; for (let y = 0; y < gh; y++) { const row = []; for (let x = 0; x < gw; x++) row.push(r.random()); g.push(row); }

    const a = g[y0][x0] + (g[y0][x0+1]-g[y0][x0])*tx, b = g[y0+1][x0] + (g[y0+1][x0+1]-g[y0+1][x0])*tx; return a + (b-a)*ty; };
}

    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {

      else if (t === CAVE) { for (let i = 0; i < 3; i++) fill(shade(c, -18), X+R.randint(2,28), Y+R.randint(2,28), 3, 3); }
      else if (t === PATH) { m.fillStyle = css(shade(c, -22)); for (let i = 0; i < 3; i++) { m.beginPath(); m.arc(X+R.randint(4,28), Y+R.randint(4,28), 2, 0, 7); m.fill(); } }

  // -------------------------------------------------------------- state / save

  }

  openMenu(m) { this.menu = m; this.tab = 0; this.scroll = 0; this.fish = null; }

  // -------------------------------------------------------------- xp / quests
  xpNeed() { return Math.floor(40 * this.level ** 1.45); }
  gainXp(n) { this.xp += n * (1 + this.pb("xp"));
    while (this.xp >= this.xpNeed()) { this.xp -= this.xpNeed(); this.level++; this.gems += 5; this.hp = 100; this.doBanner(`LEVEL ${this.level}!`, "+5 gems  -  new upgrades unlocked!", CYAN); this.burst(this.px, this.py, CYAN, 30, 220); } }
  makeRq() {

    const [d, s, a, b] = choice(opts), n = randint(a, b) * (1 + Math.floor(this.level/10));
    return [d.replace("{}", n), s, n, Math.floor(n*15*(1+this.level*0.2)), 5 + randint(0, 10), null];
  }
  curQuest() { if (this.questI < QUESTS.length) { const q = QUESTS[this.questI]; return [this.qn(this.questI), ...q.slice(1)]; }
    if (!this.rq) { this.rq = this.makeRq(); this.questBase = this.stats[this.rq[1]] || 0; } return this.rq; }
  checkQuest() {
    const [, stat, amt, c, g] = this.curQuest();
    if ((this.stats[stat] || 0) - this.questBase >= amt) {
      this.coins += c; this.gems += g; this.doBanner("QUEST COMPLETE!", `+${c} coins   +${g} gems`, GREEN); this.burst(this.px, this.py, GOLD, 30, 200);
      if (this.questI < QUESTS.length) this.questI++; this.rq = null; const nq = this.curQuest(); this.questBase = this.stats[nq[1]] || 0;

  }
  questTarget() {

      return best ? [best.x*TS+16, best.y*TS+16] : null; }

  }
  rareFx(name, ri, x, y) {

    if (ri === 4) { this.gems += 5; this.note("Legendary bonus: +5 gems!", GOLD); }
    if (ri === 5) { this.gems += 25; this.note("MYTHIC bonus: +25 gems!!!", PINK); }
  }

  // -------------------------------------------------------------- context / interact
  nearBuilding() { for (const b of this.buildings) if (dist(this.px, this.py, b.door[0], b.door[1]) < 58) return b; return null; }
  nearPlot() { for (let i = 0; i < this.plotRects.length; i++) { const r = this.plotRects[i]; if (this.px > r.x-12 && this.px < r.x+r.w+12 && this.py > r.y-12 && this.py < r.y+r.h+12) return i; } return null; }
  nearTree() { let best = null, bd = 54; for (const t of this.trees) { if (t.stump > 0) continue; const d = dist(t.x*TS+16, t.y*TS+16, this.px, this.py); if (d < bd) { bd = d; best = t; } } return best; }
  nearOre() { let best = null, bd = 54; for (const o of this.ores) { if (o.respawn > 0) continue; const d = dist(o.x*TS+16, o.y*TS+16, this.px, this.py); if (d < bd) { bd = d; best = o; } } return best; }
  nearWater() { const tx = Math.floor(this.px/TS), ty = Math.floor(this.py/TS);
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const x = tx+i, y = ty+j; if (x >= 0 && x < MW && y >= 0 && y < MH && isWater(this.tiles[y][x])) return true; } return false; }
  context() {
    const E = this.touch ? "[USE]" : "[E]", F = this.touch ? "[Hold FISH]" : "[Hold F]", Q = this.touch ? "[Hold DIG]" : "[Hold Q]";
    const b = this.nearBuilding(); if (b) return ["bld", b, `${E} Enter ${b.name}`];
    for (const n of this.npcs) if (n.state === "wait" && dist(n.x, n.y, this.px, this.py) < 52) return ["npc", n, `${E} Give ${n.cnt}x ${n.item} to ${n.name}`];
    for (const d of this.diners) if (dist(d.x, d.y, this.px, this.py) < 56) return ["diner", d, `${E} Serve ${d.dish}`];
    const i = this.nearPlot();
    if (i !== null) { const p = this.plots[i];
      if (i >= this.plotsUnlocked) return ["plot", i, "Locked plot - buy it in the SHOP"];
      if (!p.crop) return ["plot", i, `${E} Plant ${CROPS[this.selSeed][0]}` + (this.touch ? "" : "  (Z = change seed)")];
      if (p.prog >= 1) return ["plot", i, `${E} Harvest ${p.crop}!`];
      return ["plot", i, `${p.crop} growing... ${Math.floor(p.prog*100)}%`]; }
    for (const c of this.campfires) if (dist(c[0], c[1], this.px, this.py) < 50) return ["fire", c, `${E} Cook at campfire`];
    const t = this.nearTree(); if (t) return ["tree", t, `${E} Chop ${TREES[t.t][0]} - hit when the needle is GREEN!`];
    const o = this.nearOre(); if (o) return ["ore", o, `${this.touch ? "[Hold USE]" : "[Hold E]"} Mine ${ORES[o.o][0]}`];
    const tile = this.tileAt(this.px, this.py);
    if (this.nearWater() && tile !== DEEP) return ["water", null, `${E} Drink water    ${F} Fish`];
    if (tile === DEEP) return ["swim", null, `Swimming! ${Q} Dive for treasure - watch your OXYGEN!`];
    return [null, null, ""];
  }
  interact() {
    const [kind, obj] = this.context();
    if (kind === "bld") this.openMenu(obj.menu); else if (kind === "npc") this.fulfill(obj); else if (kind === "diner") this.serve(obj);
    else if (kind === "plot") this.plotAction(obj); else if (kind === "fire") this.openMenu("cook"); else if (kind === "tree") this.chop(obj);
    else if (kind === "ore") this.mine(obj);
    else if (kind === "water" && this.drinkCd <= 0) { this.water = Math.min(100, this.water + 25); this.drinkCd = 0.4; this.floatText(this.px, this.py-30, "+25 water", BLUE); }
  }

  // -------------------------------------------------------------- fishing
  castPower() { const x = ((this.t - this.fish.t0)*1.3) % 2; return 1 - Math.abs(x - 1); }
  fishDown() {
    if (!this.fish) { if (this.tileAt(this.px, this.py) === DEEP) { this.note("You can't fish while swimming!", ORANGE); return; } this.fish = {s: "charge", t0: this.t}; }
    else if (this.fish.s === "bite") this.hook();
    else if (this.fish.s === "wait") { this.fish = null; this.note("Reeled the line back in."); }
  }
  aimAngle() {
    if (!this.touch) { const [mx, my] = this.mouseWorld(); return Math.atan2(my - this.py, mx - this.px); }
    return Math.atan2(this.facing[1], this.facing[0]);
  }
  fishUp() {
    const f = this.fish; if (!f || f.s !== "charge") return;
    const p = this.castPower(), d = 40 + p*240; let ang = this.aimAngle();
    if (this.touch && !isWater(this.tileAt(this.px + Math.cos(ang)*d, this.py + Math.sin(ang)*d))) {
      // touch helper: swing the cast toward the closest water direction
      let best = null, bd = 9; for (let k = 0; k < 24; k++) { const a = k*Math.PI/12; if (isWater(this.tileAt(this.px + Math.cos(a)*d, this.py + Math.sin(a)*d))) { const diff = Math.abs(Math.atan2(Math.sin(a-ang), Math.cos(a-ang))); if (diff < bd) { bd = diff; best = a; } } }
      if (best !== null) ang = best;
    }
    const bx = this.px + Math.cos(ang)*d, by = this.py + Math.sin(ang)*d;
    if (isWater(this.tileAt(bx, by))) {

      const bait = this.take("bait", 1) !== null;
      const lure = RODS[this.tools.rod][5] * (this.has("fish3") ? 0.7 : 1) * (this.rain > 0 ? 0.75 : 1);
      this.fish = {s: "wait", bx, by, zone, t: uniform(2, 6.5)*lure, perfect: p > 0.88, bait};
      this.burst(bx, by, [200,230,255], 10, 90);
      if (p > 0.88) this.floatText(this.px, this.py-40, "PERFECT CAST! +luck", GOLD);
      if (bait) this.floatText(this.px, this.py-60, "Worm bait used +luck", PINK, 20);
    } else { this.fish = null; this.note(this.touch ? "Missed the water! Stand closer and face the water." : "Missed the water! Point your MOUSE at water.", ORANGE); }
  }
  rollFish(zone, perfect, bait) {

    const cands = FISH.filter(f => f[4].split(" ").includes(zone) && (f[6] === "any" || (f[6] === "night") === night));
    const luck = this.fishLuck() + (perfect ? 0.25 : 0) + (bait ? 0.35 : 0);
    const ri = this.rollRarity(luck, [...new Set(cands.map(f => ridx(f[1])))].sort());
    const f = choice(cands.filter(c => ridx(c[1]) === ri)); const weight = f[3]*lognorm(0.35);

  }
  hook() { const f = this.fish, fi = this.rollFish(f.zone, f.perfect, f.bait);
    this.fish = {s: "reel", fish: fi, pos: 0.5, vel: 0, fpos: uniform(0.2, 0.8), ft: 0.5, fnext: 0, prog: 0.25, w: RODS[this.tools.rod][4] + (this.has("fish2") ? 0.06 : 0), bx: f.bx, by: f.by}; }
  updateFish(dt) {
    const f = this.fish; if (!f) return;
    if (f.s === "wait") { f.t -= dt; if (f.t <= 0) { f.s = "bite"; f.t = this.touch ? 1.4 : 1.1; this.burst(f.bx, f.by, WHITE, 14, 120); } }
    else if (f.s === "bite") { f.t -= dt; if (f.t <= 0) { this.fish = null; this.note("Too slow! The fish got away...", ORANGE); } }
    else if (f.s === "reel") {
      const hold = this.keys.has("Space") || this.keys.has("KeyF") || this.down.size > 0;
      f.vel = clamp(f.vel + (hold ? 2.8 : -2.4)*dt, -1.3, 1.3); f.pos += f.vel*dt;
      const half = f.w/2; if (f.pos < half) { f.pos = half; f.vel = 0; } if (f.pos > 1-half) { f.pos = 1-half; f.vel = 0; }
      const fi = f.fish; f.fnext -= dt;
      if (f.fnext <= 0) { f.ft = uniform(0.05, 0.95); f.fnext = uniform(0.35, 1.2)/(1 + fi.ri*0.15); }
      const sp = 0.3 + fi.ri*0.18 + fi.diff*0.4; f.fpos += clamp(f.ft - f.fpos, -sp*dt, sp*dt);
      const inside = Math.abs(f.fpos - f.pos) < half; f.prog += (inside ? 0.3 : -(0.16 + 0.04*fi.ri))*dt;
      if (f.prog >= 1) { this.fish = null; this.catchFish(fi); } else if (f.prog <= 0) { this.fish = null; this.note("The fish broke free! Try again!", ORANGE); }
    }
  }
  catchFish(fi) {
    if (!this.addItem(fi.name, fi.value, fi.mut)) return;
    this.inc("fish"); this.gainXp(4*(fi.ri+1)**2);
    if (!this.discovered.has(fi.name)) { this.discovered.add(fi.name); this.note(`NEW FISH DISCOVERED: ${fi.name}!  (${this.discovered.size}/${FISH.length})`, CYAN); }
    const label = (fi.mut ? fi.mut + " " : "") + fi.name, col = RCOL[RAR[fi.ri]];
    this.floatText(this.px, this.py-40, `${label} ${fi.weight.toFixed(1)}kg`, col, 28); this.note(`Caught ${label} (${RAR[fi.ri]}) worth ${fmt(fi.value)}c`, col);
    this.burst(this.px, this.py, col, 14, 140); this.rareFx(label, fi.ri, this.px, this.py);
  }

  // -------------------------------------------------------------- chop / mine / dig
  chopZone() { return 0.14 + (this.has("wood3") ? 0.1 : 0) + (this.touch ? 0.04 : 0); }
  needle() { return (Math.sin(this.t*3.4) + 1)/2; }
  chop(t) {
    const crit = Math.abs(this.needle() - 0.5) < this.chopZone()/2;
    const dmg = AXES[this.tools.axe][3] * (this.has("wood1") ? 1.5 : 1) * (crit ? 3 : 1);
    t.hp -= dmg; const x = t.x*TS+16, y = t.y*TS+10;
    this.burst(x, y, [140,100,60], 6, 90, 0.5, 3); this.burst(x, y-20, TREES[t.t][3], 5, 70, 0.6, 3);
    this.floatText(x, y-30, (crit ? "PERFECT! -" : "-") + (+dmg.toFixed(1)), crit ? GOLD : WHITE, crit ? 26 : 20);
    if (crit) this.shake = 0.12;
    if (t.hp <= 0) {
      const [name, val, , col, rar] = TREES[t.t]; let n = 1 + this.hn("wood2") + Math.floor(this.pb("wood"));
      if (this.has("wood4") && rnd() < 0.25) { n *= 2; this.floatText(x, y-55, "TIMBER! x2", ORANGE, 30); }
      const got = this.addItem(name + " Log", val*uniform(0.9, 1.15), "", "", n);
      this.inc("logs", got); this.gainXp(2*got*(t.t+1)); this.note(`+${got} ${name} Log`, [200,160,110]);
      t.stump = t.t === 4 ? 180 : 45; this.burst(x, y, col, 25, 160); this.rareFx("Ancient Tree felled!", ridx(rar), x, y);
    }
  }
  mine(o) {
    if (this.mineCd > 0) return;
    const [name, tier, price, hp, col, rar] = ORES[o.o], pick = PICKS[this.tools.pick];
    this.mineCd = 0.4/(this.has("dig1") ? 1.4 : 1); const x = o.x*TS+16, y = o.y*TS+16;
    if (pick[4] < tier) { this.floatText(x, y-20, `Need a ${TIER_NAMES[tier]} Pickaxe!`, RED, 22); return; }
    o.hp -= pick[3]*(this.has("dig1") ? 1.4 : 1); this.burst(x, y, col, 6, 100, 0.4, 3); this.shake = Math.max(this.shake, 0.05);
    if (o.hp <= 0) {
      const n = 1 + this.hn("dig3") + randint(0, 1), got = this.addItem(name, price*uniform(0.9, 1.2), "", "", n);
      this.inc("ores", got); this.gainXp(3*got*(tier+1)); this.note(`+${got} ${name}`, col); this.floatText(x, y-20, `+${got} ${name}`, RCOL[rar]);
      o.respawn = 60; o.hp = hp; this.rareFx(name, ridx(rar), x, y);
    }
  }
  finishDig(tx, ty, dive) {
    const x = tx*TS+16, y = ty*TS+16; let luck = this.digLuck();

    let name, ri, value, col;
    if (!dive && this.tiles[ty][tx] === CAVE && rnd() < 0.4) {
      const ok = ORES.filter(o => o[1] <= PICKS[this.tools.pick][4]); const o = choices(ok, ok.map(k => k[6]));

      this.floatText(x, y-30, `Found: ${label}!`, RCOL[RAR[ri]], 26); this.note(`Dug up ${label} (${RAR[ri]})`, RCOL[RAR[ri]]); this.burst(x, y, col, 12, 120); this.rareFx(label, ri, x, y); }

  updateDig(dt) {

    if (this.digTile !== key(tx, ty)) { this.digTile = key(tx, ty); this.digProg = 0; }
    if (t === DEEP) {

      if (rnd() < 0.4) this.parts.push([this.px + uniform(-10, 10), this.py+10, uniform(-60, 60), -90, 0.5, [120,85,55], 3]);

    } else this.digProg = 0;
  }

  // -------------------------------------------------------------- farming
  plotAction(i) {
    if (i >= this.plotsUnlocked) { this.note("This plot is locked. Buy it in the SHOP (Supplies tab).", ORANGE); return; }
    const p = this.plots[i], r = this.plotRects[i], cx = r.x+32, cy = r.y+32;
    if (!p.crop) {
      let sel = CROPS[this.selSeed][0];
      if (!(this.seeds[sel] > 0)) { const c = CROPS.find(c => this.seeds[c[0]] > 0); sel = c ? c[0] : null; }
      if (!sel) { this.note("No seeds! Buy some at the SHOP.", ORANGE); return; }
      this.seeds[sel]--; p.crop = sel; p.prog = 0; this.inc("planted"); this.burst(cx, cy, [120,85,55], 10, 80); this.floatText(cx, r.y, `Planted ${sel}`, GREEN);
    } else if (p.prog >= 1) {
      const c = CROP[p.crop], n = 1 + this.hn("farm2") + randint(0, 1), m = this.has("farm3") ? 3 : 1, roll = rnd();
      let mut = "", mm = 1;
      if (roll < 0.01*m) { mut = "Rainbow"; mm = 15; } else if (roll < 0.06*m) { mut = "Golden"; mm = 5; } else if (this.rain > 0 && rnd() < 0.3) { mut = "Wet"; mm = 2; }
      const got = this.addItem(c[0], c[3]*mm*uniform(0.9, 1.1), mut, "", n);
      if (got) {
        this.inc("harvested", got); this.gainXp(3*got*(ridx(c[8])+1));
        this.floatText(cx, r.y, `+${got} ${(mut ? mut + " " : "") + c[0]}`, MUTCOL[mut] || c[4], 26); this.burst(cx, cy, c[4], 16, 120);
        if (mut === "Golden" || mut === "Rainbow") this.doBanner(`${mut.toUpperCase()} ${c[0].toUpperCase()}!`, "Mutated crops sell for way more!", MUTCOL[mut]);
        if (rnd() < 0.3) { this.seeds[c[0]] = (this.seeds[c[0]] || 0) + 1; this.note(`Found a ${c[0]} seed!`, GREEN); }
        p.crop = null; p.prog = 0;
      }
    } else this.note(`${p.crop} is ${Math.floor(p.prog*100)}% grown. Patience!  (or Instant Grow in GEM STORE)`);
  }
  growMult() { return (this.has("farm1") ? 1.3 : 1) * (this.has("farm4") ? 2 : 1) * (1 + this.pb("grow")) * (this.rain > 0 ? 1.5 : 1); }

  // -------------------------------------------------------------- hunting
  attack() {
    if (this.atkCd > 0 || this.tileAt(this.px, this.py) === DEEP) return;
    const wpn = WEAPONS[this.tools.weapon]; let a = this.aimAngle();
    if (this.touch) { let best = null, bd = 430; for (const an of this.animals) { const d = dist(an.x, an.y, this.px, this.py); if (d < bd) { bd = d; best = an; } }
      if (best) a = Math.atan2(best.y - this.py, best.x - this.px); }
    this.projs.push({x: this.px, y: this.py-6, vx: Math.cos(a)*wpn[4], vy: Math.sin(a)*wpn[4], life: 0.8, dmg: wpn[3]*(1 + this.pb("hunt")), a});
    this.atkCd = wpn[5]*(this.has("hunt1") ? 0.7 : 1);
  }
  spawnAnimal() {
    if (this.animals.length >= 14 + (this.has("hunt2") ? 6 : 0)) return;
    const night = this.isNight(), kinds = Object.keys(ANIMALS);
    const ws = kinds.map(k => ANIMALS[k][night ? "night" : "w"] * ((k === "Bear" || k === "Golden Stag") && this.has("hunt3") ? 3 : 1));
    for (let i = 0; i < 10; i++) { const [x, y] = choice(this.grassTiles), d = dist(x*TS, y*TS, this.px, this.py);
      if (d > 450 && d < 1300) { const k = choices(kinds, ws); this.animals.push({kind: k, x: x*TS+16, y: y*TS+16, hp: ANIMALS[k].hp, vx: 0, vy: 0, t: 0, cd: 0, flash: -9, dir: 1}); return; } }
  }
  kill(an) {
    const s = ANIMALS[an.kind];
    s.drops.forEach(([item, lo, hi, ch], idx) => { if (rnd() < ch) { const n = randint(lo, hi)*(this.has("hunt4") ? 2 : 1);
      const got = this.addItem(item, ITEMS[item].base*uniform(0.9, 1.2), "", "", n); if (got) this.floatText(an.x, an.y-20-18*idx, `+${got} ${item}`, RCOL[ITEMS[item].rarity], 22); } });
    this.inc("kills"); this.gainXp(s.xp); this.note(`You hunted a ${an.kind}!`, [230,180,120]); this.burst(an.x, an.y, [200,40,40], 14, 120);
    if (an.kind === "Bear") this.rareFx("BEAR DOWN!", 3, an.x, an.y); if (an.kind === "Golden Stag") this.rareFx("GOLDEN STAG!", 4, an.x, an.y);
  }
  updateAnimals(dt) {
    this.spawnT -= dt; if (this.spawnT <= 0) { this.spawnT = 1.5; this.spawnAnimal(); }
    for (const an of [...this.animals]) {
      const s = ANIMALS[an.kind], d = dist(an.x, an.y, this.px, this.py) || 1; an.cd -= dt; an.flash -= dt;
      if (d > 1800) { this.animals.splice(this.animals.indexOf(an), 1); continue; }
      let vx, vy;
      if (s.beh === "flee" && (d < 170 || an.flash > -1.5)) { vx = (an.x-this.px)/d*s.spd*1.3; vy = (an.y-this.py)/d*s.spd*1.3; }
      else if (s.beh === "aggro" && d < 260 && !this.menu) { vx = (this.px-an.x)/d*s.spd; vy = (this.py-an.y)/d*s.spd;
        if (d < s.size+16 && an.cd <= 0) { an.cd = 1; this.hp -= s.dmg; this.hurt = 0.3; this.shake = 0.2; this.floatText(this.px, this.py-30, `-${s.dmg}`, RED, 28); } }
      else { an.t -= dt; if (an.t <= 0) { an.t = uniform(1, 3); if (rnd() < 0.4) { an.vx = an.vy = 0; } else { const a = rnd()*Math.PI*2; an.vx = Math.cos(a)*s.spd*0.35; an.vy = Math.sin(a)*s.spd*0.35; } }
        vx = an.vx; vy = an.vy; }
      const nx = an.x + vx*dt, ny = an.y + vy*dt, r = Math.max(6, s.size*0.6);
      if (this.canWalk(nx, an.y, r) && !isWater(this.tileAt(nx, an.y))) an.x = nx; else an.vx *= -1;
      if (this.canWalk(an.x, ny, r) && !isWater(this.tileAt(an.x, ny))) an.y = ny; else an.vy *= -1;
      an.dir = vx >= 0 ? 1 : -1;
    }
    for (const p of [...this.projs]) {
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; let hit = false;
      for (const an of this.animals) if (dist(p.x, p.y, an.x, an.y) < ANIMALS[an.kind].size + 8) {
        an.hp -= p.dmg; an.flash = 0.2; this.floatText(an.x, an.y-25, `-${Math.floor(p.dmg)}`, ORANGE, 22); this.burst(p.x, p.y, [200,40,40], 5, 70);
        if (an.hp <= 0) { this.animals.splice(this.animals.indexOf(an), 1); this.kill(an); } hit = true; break; }
      if (hit || p.life <= 0 || this.solid(Math.floor(p.x/TS), Math.floor(p.y/TS))) this.projs.splice(this.projs.indexOf(p), 1);
    }
  }

  // -------------------------------------------------------------- npcs & restaurant
  spawnNpc() {
    const names = new Set(this.npcs.map(n => n.name)), opts = BUYERS.filter(b => !names.has(b[0]));
    if (!opts.length || this.npcs.length >= 3) return;
    const [name, cat, col] = choice(opts);
    const owned = this.bag.filter(s => ITEMS[s.name].cat === cat && !ITEMS[s.name].tags.has("junk")).map(s => s.name);
    let item;
    if (owned.length && rnd() < 0.6) item = choice(owned);
    else item = choice(Object.keys(ITEMS).filter(n => ITEMS[n].cat === cat && ridx(ITEMS[n].rarity) <= 1 && !["Fish Fillet","Fish Scales","Old Boot","Seaweed"].includes(n)));
    const cnt = cat === "wood" ? randint(5, 12) : cat === "food" ? randint(1, 2) : randint(2, 5);
    const sx = choice([51*TS, 92*TS]);
    this.npcs.push({name, cat, item, cnt, reward: Math.floor(ITEMS[item].base*cnt*1.8 + 25), gems: choice([0,0,1,2,3]), col, x: sx, y: 52.9*TS, sx, sy: 52.9*TS,
      tx: randint(56, 89)*TS+16, ty: randint(49, 54)*TS+16, state: "walk", timer: 180, msg: ""});
  }
  fulfill(n) {
    const have = this.have(n.item);
    if (have < n.cnt) { this.note(`${n.name}: "I need ${n.cnt}x ${n.item}! You have ${have}."`, ORANGE); return; }
    this.take(n.item, n.cnt); this.coins += n.reward; this.gems += n.gems; this.inc("orders"); this.gainXp(20);
    this.note(`${n.name} paid you ${n.reward} coins` + (n.gems ? ` + ${n.gems} gems!` : "!"), GOLD);
    this.floatText(n.x, n.y-40, "THANK YOU!!", GOLD, 28); this.burst(n.x, n.y, GOLD, 16, 140);
    n.state = "leave"; n.tx = n.sx; n.ty = n.sy; n.msg = "Thanks!";
  }
  updateNpcs(dt) {
    this.npcT -= dt; if (this.npcT <= 0) { this.npcT = uniform(30, 50); this.spawnNpc(); }
    for (const n of [...this.npcs]) {
      const dx = n.tx - n.x, dy = n.ty - n.y, d = Math.hypot(dx, dy);
      if ((n.state === "walk" || n.state === "leave") && d > 3) { n.x += dx/d*80*dt; n.y += dy/d*80*dt; }
      else if (n.state === "walk") n.state = "wait";
      else if (n.state === "leave") { this.npcs.splice(this.npcs.indexOf(n), 1); continue; }
      if (n.state === "wait") { n.timer -= dt; if (n.timer <= 0) { n.state = "leave"; n.tx = n.sx; n.ty = n.sy; n.msg = "Too slow..."; } }
    }
    if (!this.restaurant) return;
    this.dinerT -= dt;
    const free = [0,1,2,3].filter(s => !this.diners.some(d => d.seat === s));
    if (this.dinerT <= 0 && free.length) {
      this.dinerT = uniform(18, 30)/(this.has("cook2") ? 2 : 1);
      const owned = this.bag.filter(s => ITEMS[s.name].cat === "food").map(s => s.name);
      const dish = owned.length && rnd() < 0.6 ? choice(owned) : choice(RECIPES)[0], s = choice(free), [tx, ty] = TABLES[s];
      this.diners.push({seat: s, dish, x: tx*TS+16, y: ty*TS+46, patience: 150, col: choice([[220,120,120],[120,160,230],[140,210,140],[230,200,110]])});
    }
    for (const d of [...this.diners]) { d.patience -= dt; if (d.patience <= 0) { this.diners.splice(this.diners.indexOf(d), 1); this.note("A diner got tired of waiting and left!", ORANGE); } }
  }
  serve(d) {
    const stacks = this.bag.filter(s => s.name === d.dish);
    if (!stacks.length) { this.note(`Diner wants ${d.dish} - cook it at the KITCHEN!`, ORANGE); return; }
    const s = stacks.reduce((a, b) => b.value > a.value ? b : a), val = s.value; s.count--; if (s.count <= 0) this.removeStack(this.bag, s);
    const tip = val*uniform(0.1, 0.5)*(this.has("cook3") ? 2 : 1), pay = Math.floor(val*1.5*this.sellMult() + tip);
    this.coins += pay; this.inc("served"); this.gainXp(10); this.removeStack(this.diners, d);
    this.floatText(d.x, d.y-40, `+${pay}c  (tip ${Math.floor(tip)})`, GOLD, 26); this.floatText(d.x, d.y-64, "5 STARS! *****", GOLD, 22); this.burst(d.x, d.y, GOLD, 14, 120);
  }

  // -------------------------------------------------------------- cooking
  orderedSpecs(r) { return [...r[1]].sort((a, b) => (GENERIC.has(a[0]) ? 1 : 0) - (GENERIC.has(b[0]) ? 1 : 0)); }
  plan(r) {
    const counts = new Map(this.bag.map(s => [s, s.count])), sorted = [...this.bag].sort((a, b) => a.value - b.value);
    for (let [spec, n] of this.orderedSpecs(r)) {
      for (const s of sorted) { if (ITEMS[s.name].tags.has(spec) && counts.get(s) > 0) { const k = Math.min(n, counts.get(s)); counts.set(s, counts.get(s)-k); n -= k; } if (!n) break; }
      if (n > 0) return false;
    }
    return true;
  }
  startCook(r) { if (!this.plan(r)) return; let val = 0; for (const [spec, n] of this.orderedSpecs(r)) val += this.take(spec, n) || 0; this.cook = {r, val, pos: 0, dir: 1, spd: 1, t: 0}; }
  cookStop() {
    const c = this.cook, off = Math.abs(c.pos - 0.5);
    let q = off < 0.04 ? "Gourmet" : off < 0.12 ? "Perfect" : off < 0.35 ? "Good" : "Burnt"; if (c.t > 7) q = "Burnt";
    const r = c.r, value = (c.val*1.3 + 15 + r[5]*0.5) * QMULT[q] * (this.has("cook1") ? 1.25 : 1) * (this.has("cook4") ? 2 : 1);
    this.addItem(r[0], value, "", q); this.inc("cooked"); this.gainXp(8);
    this.note(`Cooked ${r[0]} (${q})! Worth ${fmt(value)}c`, QUAL.find(x => x[0] === q)[2]);
    if (q === "Gourmet") this.doBanner("GOURMET!!", `${r[0]} worth ${fmt(value)} coins`, PINK);
    this.cook = null;
  }
  scaleFish() {
    let done = 0;
    for (const s of this.bag.filter(s => ITEMS[s.name].tags.has("fish"))) {
      const ri = ridx(ITEMS[s.name].rarity), nf = 1 + Math.floor(ri/2);
      while (s.count > 0) { if (this.bagCap() - this.count(this.bag) < nf) break; s.count--; this.addItem("Fish Fillet", s.value*0.8/nf, "", RAR[ri], nf); this.addItem("Fish Scales", s.value*0.3); done++; }
      if (s.count <= 0) this.removeStack(this.bag, s);
    }
    if (done) { this.gainXp(done); this.note(`Scaled & filleted ${done} fish!`, [250,170,150]); } else this.note("No fish to scale (or bag too full)!", ORANGE);
  }

  // -------------------------------------------------------------- eating / survival
  edible(s) { const it = ITEMS[s.name]; return it.hunger || it.thirst || it.heal > 0; }
  eat(s) {
    const it = ITEMS[s.name]; if (!(it.hunger || it.thirst || it.heal)) return false;
    const qm = QMULT[s.q] || 1;
    this.food = Math.min(100, this.food + it.hunger*(0.6 + 0.4*qm)); this.water = Math.min(100, this.water + it.thirst); this.hp = clamp(this.hp + it.heal*(0.6 + 0.4*qm), 1, 100);
    s.count--; if (s.count <= 0) this.removeStack(this.bag, s);
    const parts = [it.hunger ? `+${it.hunger} food` : "", it.thirst ? `+${it.thirst} water` : "", it.heal ? (it.heal > 0 ? `+${it.heal} hp` : `${it.heal} hp (raw!)`) : ""];
    this.floatText(this.px, this.py-40, parts.filter(Boolean).join("  "), GREEN, 22); return true;
  }
  eatBest() {
    let best = null, bs = 0;
    for (const s of this.bag) { const it = ITEMS[s.name]; const sc = Math.min(it.hunger, 100-this.food) + Math.min(it.thirst, 100-this.water) + Math.min(Math.max(it.heal, 0), 100-this.hp) + Math.min(it.heal, 0); if (sc > bs) { bs = sc; best = s; } }
    if (best) this.eat(best); else this.note("Nothing good to eat! Cook food, farm or buy snacks.", ORANGE);
  }
  buildFire() { if (this.take("wood", 3) === null) { this.note("A campfire needs 3 logs. Go chop some trees!", ORANGE); return; } this.campfires.push([this.px, this.py+20, 240]); this.note(`Campfire built! ${this.touch ? "Tap USE" : "Press E"} near it to cook.`, ORANGE); }
  die() {
    const lost = Math.floor(this.coins*0.1);
    const respawn = () => { this.coins -= lost; [this.px, this.py] = this.spawn; this.hp = 100; this.food = 60; this.water = 60; this.oxy = 100; };
    const revive = () => { if (this.gems < 10) { this.needGems(10); respawn(); return; } this.gems -= 10; this.hp = 100; this.food = 80; this.water = 80; this.oxy = 100; this.note("Revived on the spot!", PINK); };
    this.hp = 1; this.fish = null;
    this.popup("YOU FAINTED!", ["You ran out of health!", `Respawn at home and lose ${lost} coins...`, "...or REVIVE right here for 10 gems!"], [["REVIVE (10 gems)", revive, PINK], ["Respawn at home", respawn, PANEL3]], RED);
  }

  // -------------------------------------------------------------- shop actions
  buyTool(kind, i) {
    const t = TOOLS[kind][1][i];
    if (t[2]) { if (this.gems < t[2]) { this.needGems(t[2]); return; } this.gems -= t[2]; }
    else { if (this.coins < t[1]) { this.note("Not enough coins!", RED); return; } this.coins -= t[1]; }
    this.tools[kind] = i; this.doBanner("NEW GEAR!", t[0], CYAN);
  }
  buySeed(c, n) {
    if (c[5]) { if (this.gems < c[5]*n) { this.needGems(c[5]*n); return; } this.gems -= c[5]*n; }
    else { if (this.coins < c[1]*n) { this.note("Not enough coins!", RED); return; } this.coins -= c[1]*n; }
    this.seeds[c[0]] = (this.seeds[c[0]] || 0) + n; this.selSeed = CROPS.indexOf(c); this.note(`Bought ${n} ${c[0]} seed${n > 1 ? "s" : ""}!`, GREEN);
  }
  buySupply([name, price, n]) { if (this.coins < price) { this.note("Not enough coins!", RED); return; } if (this.addItem(name, ITEMS[name].base, "", "", n)) this.coins -= price; }
  buyPlot() { const k = this.plotsUnlocked - 6; if (k >= PLOT_PRICES.length) return; if (this.coins < PLOT_PRICES[k]) { this.note("Not enough coins!", RED); return; } this.coins -= PLOT_PRICES[k]; this.plotsUnlocked++; this.note("New garden plot unlocked!", GREEN); }
  buyStorage() { const p = this.chestCap*5; if (this.coins < p) { this.note("Not enough coins!", RED); return; } this.coins -= p; this.chestCap += 50; this.note(`Storage chest now holds ${this.chestCap}!`, GREEN); }
  buySkill(s) { if (this.coins < s[3]) { this.note("Not enough coins!", RED); return; } this.coins -= s[3]; this.skills.add(s[0]); this.inc("skills"); this.doBanner("UPGRADE UNLOCKED!", `${s[1]}: ${s[2]}`, PURPLE); }
  sell(cat=null) {
    let total = 0, n = 0;
    for (const s of [...this.bag]) { const c = ITEMS[s.name].cat; if ((cat === null && c !== "misc") || c === cat) { total += s.value*s.count; n += s.count; this.removeStack(this.bag, s); } }
    if (!n) { this.note("Nothing to sell!", ORANGE); return; }
    total = Math.floor(total*this.sellMult()); this.coins += total; this.inc("sold", n);
    this.note(`Sold ${n} items for ${fmt(total)} coins!`, GOLD); this.floatText(this.px, this.py-40, `+${fmt(total)} coins`, GOLD, 32); this.burst(this.px, this.py, GOLD, Math.min(60, 10+n), 200);
    if (total >= 1000) this.doBanner("KA-CHING!", `+${fmt(total)} coins`, GOLD);
  }
  hatchEgg(i) {
    const [, coins, gems, ws] = EGGS[i];
    if (gems) { if (this.gems < gems) { this.needGems(gems); return; } this.gems -= gems; }
    else { if (this.coins < coins) { this.note("Not enough coins!", RED); return; } this.coins -= coins; }
    const ri = choices([0,1,2,3,4,5], ws), pet = choice(PETS.filter(p => ridx(p[1]) === ri));
    this.pets.push(pet[0]); if (this.equipped.length < this.petSlots) this.equipped.push(this.pets.length-1); this.inc("hatched");
    this.hatch = {egg: i, t: 0, pet: pet[0], roll: [...Array.from({length: 28}, () => choice(PETS)[0]), pet[0]], fx: false};
  }

function frame(now) {
  const dt = Math.min((now - last)/1000, 0.05); last = now; game.t += dt;
  try { if (!game.title) game.update(dt); game.draw(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? document.fonts.load(`600 20px "Fredoka"`).catch(() => {}) : Promise.resolve()).finally(() => requestAnimationFrame(frame));
</script>
